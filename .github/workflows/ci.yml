name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[notebook]"
          pip install ruff mypy pytest

      - name: Lint with ruff
        run: ruff check src/

      - name: Type check with mypy
        run: mypy src/nba_predictor/ --ignore-missing-imports

      - name: Run tests
        run: pytest tests/ -v --tb=short || echo "No tests found yet"

      - name: Verify imports
        run: |
          python -c "from nba_predictor.scraping import collect_all_seasons"
          python -c "from nba_predictor.features.selection import select_features"
          python -c "from nba_predictor.models.bakeoff import run_bakeoff"
          python -c "from nba_predictor.models.predict import save_model, load_model"
