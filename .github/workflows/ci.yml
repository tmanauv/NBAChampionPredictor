name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src/ tests/

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify imports
        run: |
          python -c "from src.scraping import team_records, playoff_records, conf_standings, roster_accolades, season_details"
          python -c "from src.features import select_correlated_features, build_correlation_matrix, get_feature_splits"
          python -c "from src.model import build_preprocessor, cross_validate_models, predict_champions"
          python -c "from src.utils import plot_correlation_matrix, plot_feature_importance"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short || echo "No tests found yet"
