[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nba-predictor"
version = "0.1.0"
description = "Predict NBA Champions using ML regression on historical Basketball Reference data"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "xgboost>=2.0",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "joblib>=1.3",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
where = ["src"]
